# =============================================================================
# Monitoring Stack - Docker Compose Configuration
# Domain: wk-archi-o24a-4-5-g1.fr
#
# Services:
#   - Prometheus   (metrics collection & alerting rules)
#   - Grafana      (dashboards & visualization)
#   - Loki         (log aggregation)
#   - Promtail     (log shipping agent)
#   - cAdvisor     (container metrics)
#   - AlertManager (alert routing & notifications)
#   - Node Exporter (host-level metrics)
#
# Networks:
#   - ci_network         : shared with CI/CD services (external)
#   - workflow-network   : shared with workflow services (external)
#   - monitoring_network : internal network for inter-service communication
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection & Storage
  # Accessible at: https://prometheus.wk-archi-o24a-4-5-g1.fr
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.4
    container_name: common-prometheus-ci
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
    networks:
      - ci_network
      - monitoring_network
    labels:
      # --- Traefik reverse-proxy configuration ---
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.wk-archi-o24a-4-5-g1.fr`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      # Prometheus has no native auth: protect the public route with basic auth
      # (reuses the dashboard credentials) + rate limiting on this admin endpoint.
      - "traefik.http.routers.prometheus.middlewares=secure-headers@file,rate-limit@file,traefik-auth@docker"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=ci_network"

  # ---------------------------------------------------------------------------
  # Grafana - Dashboards & Visualization
  # Accessible at: https://monitor.wk-archi-o24a-4-5-g1.fr
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.1.0
    container_name: common-grafana-ci
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://monitor.wk-archi-o24a-4-5-g1.fr
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ci_network
      - monitoring_network
    labels:
      # --- Traefik reverse-proxy configuration ---
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.wk-archi-o24a-4-5-g1.fr`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=secure-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=ci_network"
      - "traefik.http.routers.grafana-alias.rule=Host(`grafana.wk-archi-o24a-4-5-g1.fr`)"
      - "traefik.http.routers.grafana-alias.entrypoints=websecure"
      - "traefik.http.routers.grafana-alias.tls=true"
      - "traefik.http.routers.grafana-alias.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana-alias.middlewares=secure-headers@file"
      - "traefik.http.routers.grafana-alias.service=grafana"

  # ---------------------------------------------------------------------------
  # Loki - Log Aggregation Backend
  # Internal only - not exposed via Traefik
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.3
    container_name: common-loki-ci
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - ci_network
      - monitoring_network
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Alloy - Log Shipping Agent (replaces Promtail, EOL 2026-03-02)
  # Internal only - collects and forwards logs to Loki
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: common-alloy-ci
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ci_network
      - monitoring_network
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # cAdvisor - Container Metrics Exporter
  # Internal only - scraped by Prometheus on port 8080 via the Docker network.
  # No host port published (the CST discourages exposing it publicly).
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.3
    container_name: common-cadvisor-ci
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ci_network
      - monitoring_network
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # AlertManager - Alert Routing & Notification
  # Internal only - receives alerts from Prometheus
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.33.0
    container_name: common-alertmanager-ci
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    networks:
      - ci_network
      - monitoring_network
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # DORA Metrics - Deployment Frequency, Lead Time, Change Failure Rate, MTTR
  # Internal only. Ofelia (docker-compose.backup.yml) triggers the script on a
  # schedule; results are written to the node-exporter textfile directory,
  # same mechanism as the backup metrics.
  # ---------------------------------------------------------------------------
  dora-metrics:
    build: ./dora
    container_name: common-dora-metrics-ci
    restart: unless-stopped
    environment:
      GITLAB_URL: http://common-gitlab-ci
      GITLAB_TOKEN: ${GITLAB_ROOT_PAT}
      GITLAB_PROJECT_ID: "1"
      WINDOW_DAYS: "30"
      TEXTFILE_DIR: /textfiles
    volumes:
      - /opt/furious-ducks/infrastructure/node-exporter/textfiles:/textfiles
    networks:
      - ci_network
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Node Exporter - Host-Level Metrics
  # Internal only - scraped by Prometheus for OS/hardware metrics
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: common-node-exporter-ci
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/var/lib/node_exporter/textfiles"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /opt/furious-ducks/infrastructure/node-exporter/textfiles:/var/lib/node_exporter/textfiles:ro
    networks:
      - ci_network
      - monitoring_network
    labels:
      - "traefik.enable=false"

# =============================================================================
# Networks
# =============================================================================
networks:
  # Shared network with CI/CD services (created by main docker-compose)
  ci_network:
    external: true

  # Shared network with workflow services
  workflow-network:
    external: true

  # Internal network for monitoring services communication
  monitoring_network:
    driver: bridge

# =============================================================================
# Volumes - Persistent storage for monitoring data
# =============================================================================
volumes:
  prometheus-data:
    name: common-prometheus-data-ci
    driver: local
  grafana-data:
    name: common-grafana-data-ci
    driver: local
  loki-data:
    name: common-loki-data-ci
    driver: local
  alloy-data:
    name: common-alloy-data-ci
    driver: local
  alertmanager-data:
    name: common-alertmanager-data-ci
    driver: local
