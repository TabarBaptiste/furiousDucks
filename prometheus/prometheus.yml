# =============================================================================
# Prometheus Configuration
# =============================================================================
# Central monitoring configuration for the CI/CD infrastructure.
# Scrapes metrics from all platform services and evaluates alerting rules.
# =============================================================================

global:
  # How frequently to scrape targets by default.
  scrape_interval: 15s

  # How frequently to evaluate alerting and recording rules.
  evaluation_interval: 15s

# =============================================================================
# Alerting Configuration
# =============================================================================
# Forward alerts to AlertManager for deduplication, grouping, and routing.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - common-alertmanager-ci:9093

# =============================================================================
# Rule Files
# =============================================================================
# Load alerting and recording rules from the rules directory.
rule_files:
  - /etc/prometheus/rules/*.yml

# =============================================================================
# Scrape Configurations
# =============================================================================
# Each job defines a set of targets to scrape and any job-specific overrides.
scrape_configs:

  # ---------------------------------------------------------------------------
  # 1. Prometheus (self-monitoring)
  # ---------------------------------------------------------------------------
  # Prometheus scrapes its own metrics to monitor query performance,
  # storage usage, and scrape health.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ---------------------------------------------------------------------------
  # 2. Node Exporter
  # ---------------------------------------------------------------------------
  # Exposes host-level hardware and OS metrics (CPU, memory, disk, network).
  - job_name: node-exporter
    static_configs:
      - targets:
          - common-node-exporter-ci:9100

  # ---------------------------------------------------------------------------
  # 3. cAdvisor
  # ---------------------------------------------------------------------------
  # Exposes container-level resource usage and performance metrics.
  - job_name: cadvisor
    static_configs:
      - targets:
          - common-cadvisor-ci:8080

  # ---------------------------------------------------------------------------
  # 4. Traefik (Reverse Proxy / Load Balancer)
  # ---------------------------------------------------------------------------
  # Traefik exposes metrics on its dedicated internal "metrics" entrypoint
  # (:8082), not on the public websecure entrypoint or the api/dashboard port.
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - common-traefik-ci:8082

  # ---------------------------------------------------------------------------
  # 5. Jenkins (CI Server)
  # ---------------------------------------------------------------------------
  # Exposes build queue length, executor usage, job durations, and plugin stats.
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets:
          - common-jenkins-ci:8080

  # ---------------------------------------------------------------------------
  # 6. GitLab (Source Code Management)
  # ---------------------------------------------------------------------------
  # Exposes Rails, Sidekiq, and Gitaly performance metrics.
  # Note: Requires the Prometheus metrics endpoint to be enabled in GitLab
  # admin settings (Admin > Settings > Metrics and profiling > Metrics).
  - job_name: gitlab
    metrics_path: /-/metrics
    static_configs:
      - targets:
          - common-gitlab-ci:80

  # ---------------------------------------------------------------------------
  # 7. SonarQube (Code Quality)
  # ---------------------------------------------------------------------------
  # NOTE: /api/monitoring/metrics (Prometheus format) requires Developer
  # Edition and is not available in Community Edition. /api/system/status
  # returns JSON, which Prometheus cannot scrape as a metric. Container-level
  # availability is covered instead by the ContainerDown alert (cAdvisor).

  # ---------------------------------------------------------------------------
  # 8. MinIO (Object Storage)
  # ---------------------------------------------------------------------------
  # Exposes bucket usage, request rates, and replication metrics.
  # Bearer token generated via: mc admin prometheus generate local
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    # Bearer token injected via a mounted secret file (never committed).
    # Generate with: mc admin prometheus generate local
    # then write it to ./prometheus/secrets/minio_token (see the .example).
    bearer_token_file: /etc/prometheus/secrets/minio_token
    static_configs:
      - targets:
          - common-minio-ci:9000

  # ---------------------------------------------------------------------------
  # 9. Loki (Log Aggregation)
  # ---------------------------------------------------------------------------
  # Exposes ingestion rates, query performance, and storage metrics.
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - common-loki-ci:3100

  # ---------------------------------------------------------------------------
  # 10. Grafana (Dashboarding)
  # ---------------------------------------------------------------------------
  # Exposes dashboard render times, data source health, and user sessions.
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - common-grafana-ci:3000

  # ---------------------------------------------------------------------------
  # 11. PostgreSQL Exporter (SonarQube DB + Mattermost DB)
  # ---------------------------------------------------------------------------
  # Exposes per-database connection, query, and replication metrics for the
  # two internal PostgreSQL instances (see docker-compose.yml).
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - common-sonarqube-db-exporter-ci:9187
        labels:
          database: sonarqube
      - targets:
          - common-mattermost-db-exporter-ci:9187
        labels:
          database: mattermost

  # ---------------------------------------------------------------------------
  # 12. Harbor (Docker Registry)
  # ---------------------------------------------------------------------------
  # Harbor's nginx (proxy) container exposes a unified metrics endpoint on
  # port 9090, proxying internally to the exporter/core/jobservice/registry
  # components (see /opt/harbor-install/common/config/nginx/nginx.conf on the
  # Harbor host). The container is named "nginx" (Harbor's own convention,
  # not "harbor-nginx"). Harbor is deployed separately (see docker-compose.yml
  # header and docs/04-harbor.md) and must have metrics enabled
  # (metric.enabled: true, metric.port: 9090 in harbor.yml) with its "proxy"
  # service attached to ci_network. This target reports down until then.
  - job_name: harbor
    metrics_path: /metrics
    static_configs:
      - targets:
          - nginx:9090
