# =============================================================================
# Prometheus Alerting Rules
# =============================================================================
# Production alerting rules for the CI/CD infrastructure platform.
#
# Severity levels:
#   - critical : Immediate action required. Service is down or data loss is
#                imminent. Pages on-call engineers.
#   - warning  : Attention needed soon. Performance is degraded or a threshold
#                is approaching. Sends notification to the team channel.
# =============================================================================

groups:

  # ===========================================================================
  # Group 1 - Infrastructure Alerts
  # ===========================================================================
  # Host-level alerts for CPU, memory, and disk on the underlying machines.
  - name: infrastructure
    rules:

      # -----------------------------------------------------------------------
      # CPU: sustained high usage may indicate runaway processes or under-
      # provisioned hosts.
      # -----------------------------------------------------------------------
      - alert: HostHighCpuUsage
        expr: >
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation CPU élevée sur {{ $labels.instance }}"
          description: >
            L'utilisation CPU sur {{ $labels.instance }} dépasse 85% depuis
            5 minutes. Valeur actuelle : {{ $value | printf "%.1f" }}%.

      # -----------------------------------------------------------------------
      # Memory: sustained high memory pressure increases swap usage and the
      # risk of OOM kills.
      # -----------------------------------------------------------------------
      - alert: HostHighMemoryUsage
        expr: >
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation mémoire élevée sur {{ $labels.instance }}"
          description: >
            L'utilisation mémoire sur {{ $labels.instance }} dépasse 85% depuis
            5 minutes. Valeur actuelle : {{ $value | printf "%.1f" }}%.

      # -----------------------------------------------------------------------
      # Disk (warning): running low on disk space causes build failures,
      # log loss, and database corruption.
      # -----------------------------------------------------------------------
      - alert: HostDiskSpaceLow
        expr: >
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque faible sur {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >
            L'utilisation disque sur {{ $labels.instance }}, point de montage
            {{ $labels.mountpoint }}, dépasse 85% depuis 5 minutes.
            Valeur actuelle : {{ $value | printf "%.1f" }}%.

      # -----------------------------------------------------------------------
      # Disk (critical): nearly full disk requires immediate intervention.
      # -----------------------------------------------------------------------
      - alert: HostDiskSpaceCritical
        expr: >
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Espace disque critique sur {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >
            L'utilisation disque sur {{ $labels.instance }}, point de montage
            {{ $labels.mountpoint }}, a dépassé 95%. Action immédiate requise.
            Valeur actuelle : {{ $value | printf "%.1f" }}%.

      # -----------------------------------------------------------------------
      # Disk (predictive): linear extrapolation predicts the filesystem will
      # be full within 4 hours based on the trend of the last 1 hour.
      # -----------------------------------------------------------------------
      - alert: HostOutOfDiskSpace
        expr: >
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[1h], 4 * 3600
          ) < 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disque sur {{ $labels.instance }} ({{ $labels.mountpoint }}) : saturation prévue sous 4h"
          description: >
            Selon la tendance actuelle, le système de fichiers sur
            {{ $labels.instance }}, point de montage {{ $labels.mountpoint }},
            devrait manquer d'espace dans les 4 prochaines heures.

  # ===========================================================================
  # Group 2 - Container Alerts
  # ===========================================================================
  # Container-level alerts monitored via cAdvisor metrics.
  - name: container
    rules:

      # -----------------------------------------------------------------------
      # Container down: cAdvisor stops refreshing container_last_seen once a
      # container stops, crashes, or is removed.
      #
      # HISTORY: this alert was removed when cAdvisor was on v0.49.1/v0.52.1,
      # because the "name" label on container_last_seen was never populated
      # under Docker's containerd-snapshotter storage backend (manager.go:1116
      # "failed to identify the read-write layer ID"). The upgrade to cAdvisor
      # v0.60.3 (see docker-compose.monitoring.yml) fixed this - verified live
      # on this host: container_last_seen now carries a correct "name" label
      # for every tracked container except the root cgroup ("/", excluded by
      # the "common-.+" pattern below).
      #
      # Scoped to "common-.+" (platform services), not ".+" like the other
      # container alerts: Jenkins' ephemeral Docker build agents are expected
      # to stop constantly (docker-agent* templates, idleMinutes: 10) and
      # would otherwise fire this alert on every teardown.
      #
      # Caveat: if cAdvisor evicts a stopped container's stats entirely
      # (its internal retention for gone containers), the series disappears
      # and this alert silently stops firing rather than staying in a
      # "resolved" state - a general cAdvisor limitation, not specific to
      # this rule.
      # -----------------------------------------------------------------------
      - alert: ContainerDown
        expr: >
          (time() - container_last_seen{name=~"common-.+"}) > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Le conteneur {{ $labels.name }} semble arrêté"
          description: >
            cAdvisor n'a signalé aucun échantillon récent pour le conteneur
            {{ $labels.name }} depuis plus de 90 secondes. Il a peut-être été
            arrêté, a planté, ou a été supprimé. Ancienneté actuelle :
            {{ $value | printf "%.0f" }}s.

      # -----------------------------------------------------------------------
      # Container CPU: sustained high CPU may starve other containers sharing
      # the same host.
      # -----------------------------------------------------------------------
      - alert: ContainerHighCpuUsage
        expr: >
          (rate(container_cpu_usage_seconds_total{name=~".+"}[5m])) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation CPU élevée dans le conteneur {{ $labels.name }}"
          description: >
            L'utilisation CPU du conteneur {{ $labels.name }} dépasse 80%
            depuis 5 minutes. Valeur actuelle : {{ $value | printf "%.1f" }}%.

      # -----------------------------------------------------------------------
      # Container memory: high memory usage increases the risk of OOM kills.
      # Only containers that declare a memory limit are covered: cAdvisor
      # reports container_spec_memory_limit_bytes = 0 for the others, and
      # dividing by 0 gives +Inf, which fired this alert on every container
      # of the host at once (42 alerts on 2026-09-04). Unlimited containers
      # are covered by HostHighMemoryUsage instead.
      # -----------------------------------------------------------------------
      - alert: ContainerHighMemoryUsage
        expr: >
          (container_memory_usage_bytes{name=~".+"}
           / (container_spec_memory_limit_bytes{name=~".+"} > 0)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation mémoire élevée dans le conteneur {{ $labels.name }}"
          description: >
            L'utilisation mémoire du conteneur {{ $labels.name }} dépasse 80%
            de sa limite depuis 5 minutes. Valeur actuelle : {{ $value | printf "%.1f" }}%.

      # -----------------------------------------------------------------------
      # Container restarts: frequent restarts indicate a crash loop.
      # -----------------------------------------------------------------------
      - alert: ContainerRestarting
        expr: >
          increase(container_restart_count{name=~".+"}[5m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Le conteneur {{ $labels.name }} redémarre fréquemment"
          description: >
            Le conteneur {{ $labels.name }} a redémarré plus de 3 fois au
            cours des 5 dernières minutes. Cela peut indiquer une boucle de plantage.

  # ===========================================================================
  # Group 3 - CI/CD Services Alerts
  # ===========================================================================
  # Application-level alerts for the core CI/CD services.
  - name: cicd-services
    rules:

      # -----------------------------------------------------------------------
      # Jenkins down: blocks all CI pipelines.
      # -----------------------------------------------------------------------
      - alert: JenkinsDown
        expr: up{job="jenkins"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Jenkins est inaccessible"
          description: >
            Le serveur Jenkins CI (job={{ $labels.job }}) est inaccessible
            depuis plus de 2 minutes. Tous les pipelines CI sont bloqués.

      # -----------------------------------------------------------------------
      # GitLab down: blocks all source code operations and MR workflows.
      # -----------------------------------------------------------------------
      - alert: GitLabDown
        expr: up{job="gitlab"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GitLab est inaccessible"
          description: >
            L'instance GitLab (job={{ $labels.job }}) est inaccessible
            depuis plus de 2 minutes. La gestion du code source est indisponible.

      # -----------------------------------------------------------------------
      # Traefik error rate: a high 5xx rate indicates upstream service failures
      # or misconfigurations.
      # -----------------------------------------------------------------------
      - alert: TraefikHighErrorRate
        expr: >
          (
            sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m]))
            /
            sum(rate(traefik_entrypoint_requests_total[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur Traefik"
          description: >
            Le reverse proxy Traefik retourne des erreurs HTTP 5xx à un taux
            supérieur à 5% sur les 5 dernières minutes.
            Taux d'erreur actuel : {{ $value | printf "%.2f" }}%.

  # ===========================================================================
  # Group 4 - Backup Alerts
  # ===========================================================================
  # Alerts for backup job health. Relies on a custom metric pushed by the
  # backup scripts (e.g. via Pushgateway or node-exporter textfile collector):
  #   - backup_last_success_timestamp_seconds : Unix timestamp of last success
  #   - backup_last_status                    : 0 = success, 1 = failure
  - name: backup
    rules:

      # -----------------------------------------------------------------------
      # Backup failed: the most recent backup job reported a failure.
      # -----------------------------------------------------------------------
      - alert: BackupFailed
        expr: backup_last_status == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Échec du job de sauvegarde {{ $labels.job }}"
          description: >
            Le job de sauvegarde {{ $labels.job }} a signalé un échec.
            Investiguez immédiatement pour éviter toute perte de données.

      # -----------------------------------------------------------------------
      # Backup too old: no successful backup in the last 26 hours. The 26h
      # threshold allows a 2-hour grace period over a daily (24h) schedule.
      # -----------------------------------------------------------------------
      - alert: BackupTooOld
        expr: >
          (time() - backup_last_success_timestamp_seconds) > (26 * 3600)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Aucune sauvegarde récente pour {{ $labels.job }}"
          description: >
            Aucune sauvegarde réussie n'a été enregistrée pour le job
            {{ $labels.job }} depuis 26 heures. La planification quotidienne
            des sauvegardes est peut-être en panne.
