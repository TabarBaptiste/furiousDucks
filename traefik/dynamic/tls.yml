# =============================================================================
# Traefik Dynamic Configuration - TLS Options
# Domain: wk-archi-o24a-4-5-g1.fr
# =============================================================================

tls:

  # ---------------------------------------------------------------------------
  # TLS options
  # ---------------------------------------------------------------------------
  options:

    # Default TLS profile - enforces TLS 1.2+ with modern cipher suites
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

  # ---------------------------------------------------------------------------
  # TLS stores - default certificate resolver
  # ---------------------------------------------------------------------------
  stores:
    default:
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: traefik.wk-archi-o24a-4-5-g1.fr
          sans:
            - registry.wk-archi-o24a-4-5-g1.fr
